name: Deploy Pages

on:
  push:
    branches: [main]
    # Feedback sync only updates data/ — no need to redeploy the site,
    # and those commits were previously marking the repo with a red X.
    paths-ignore:
      - "data/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject feedback token for live form submits
        env:
          FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_TOKEN }}
        run: |
          if [ -z "$FEEDBACK_TOKEN" ]; then
            echo "::error::FEEDBACK_TOKEN secret is missing. Add a PAT that can create repository_dispatch events."
            exit 1
          fi
          node <<'NODE'
          const fs = require("fs");
          const path = "js/config.js";
          const token = process.env.FEEDBACK_TOKEN;
          let src = fs.readFileSync(path, "utf8");
          if (!src.includes("REPLACE_FEEDBACK_TOKEN")) {
            throw new Error("config.js is missing REPLACE_FEEDBACK_TOKEN placeholder");
          }
          if (!token || token === "REPLACE_FEEDBACK_TOKEN") {
            throw new Error("FEEDBACK_TOKEN secret is empty");
          }
          src = src.split("REPLACE_FEEDBACK_TOKEN").join(token);
          fs.writeFileSync(path, src);
          console.log("Injected FEEDBACK_TOKEN into js/config.js for Pages");
          NODE

      - name: Prepare Pages files
        run: |
          echo "Building public Pages artifact"
          rm -rf node_modules .git
          rm -f package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
