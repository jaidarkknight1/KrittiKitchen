name: Sync feedback to GitHub

# Pulls new form submissions into data/responses.json + .csv
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [sync_feedback]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync inbox submissions into tracking files
        run: node scripts/sync-from-inbox.js

      - name: Commit tracking files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync feedback responses"
          file_pattern: data/responses.json data/responses.csv
