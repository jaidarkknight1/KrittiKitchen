name: Sync feedback to GitHub

# Pulls live store submissions into data/responses.json + .csv
on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [sync_feedback]

permissions:
  contents: write

concurrency:
  group: sync-feedback
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync live store into tracking files
        run: node scripts/sync-from-mantle.js

      - name: Commit tracking files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync feedback responses"
          file_pattern: data/responses.json data/responses.csv
