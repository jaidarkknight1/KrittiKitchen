name: Record feedback

# Runs every time the website dispatches a new feedback event
on:
  repository_dispatch:
    types: [feedback_submitted]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Append feedback to tracking files
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: node scripts/append-feedback.js

      - name: Commit tracking files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: record customer feedback"
          file_pattern: data/responses.json data/responses.csv
